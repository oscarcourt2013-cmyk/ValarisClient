name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 21 builds the 1.21.11 layer, 25 the 26.2 layer.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Build ValerisClient mods
        shell: pwsh
        run: |
          .\gradlew :mc-1.21.11:build :mc-26.2:build --no-daemon

      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-bundle | Out-Null
          foreach ($dir in @('mc-1.21.11', 'mc-26.2')) {
            Get-ChildItem "$dir/build/libs/valeris-client-*.jar" |
              Where-Object { $_.Name -notmatch 'sources|dev' } |
              Copy-Item -Destination release-bundle/
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-bundle/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
