name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build ValarisClient mods
        shell: pwsh
        run: |
          .\gradlew :mc-1.21.11:build --no-daemon

      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-bundle | Out-Null
          Get-ChildItem "mc-1.21.11/build/libs/valaris-client-*.jar" |
            Where-Object { $_.Name -notmatch 'sources|dev' } |
            Copy-Item -Destination release-bundle/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-bundle/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
