pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'valaris-client'

// Common core: pure Java, no Minecraft dependency, shared by every version layer.
include 'core'

// Version layer: the Fabric mod for the supported Minecraft version.
include 'mc-1.21.11'
