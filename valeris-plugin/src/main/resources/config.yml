# ValerisClient — Paper/Purpur server bridge
# Channel: valerisclient:main (must match the Fabric mod)

server-id: elysia-smp
server-name: Elysia SMP

# Minimum protocol accepted from the client (docs/SERVER_API.md)
protocol:
  min: 1
  max: 1
  accept-message: "Welcome to Elysia SMP — ValerisClient verified"
  reject-message: "Unsupported ValerisClient protocol"

database:
  type: sqlite # sqlite | mysql
  sqlite-file: ValerisClient.db
  mysql:
    host: 127.0.0.1
    port: 3306
    database: ValerisClient
    username: prime
    password: change-me
    pool-size: 8

rewards:
  first_join:
    enabled: true
    message: "<gold>⚡</gold> <white>Merci d'utiliser <yellow>ValerisClient</yellow> ! Récompense débloquée.</white>"
    commands:
      - "eco give %player% 500"
      - "crate key give %player% vote 1"

xp:
  playtime-minutes: 10
  playtime-amount: 5
  login-amount: 2
  notify-client: true

verified:
  badge: "⚡"
  chat-format: "<gold>⚡</gold> <gray>%player%</gray> <dark_gray>»</dark_gray> <white>%message%</white>"
  tab-prefix: "<gold>⚡ </gold>"
  require-detection: true
  grant-permission: true

network:
  enabled: false
  # rest | redis
  mode: rest
  rest-url: "http://127.0.0.1:26005"
  rest-token: ""
  redis:
    host: 127.0.0.1
    port: 6379
    password: ""
    channel: ValerisClient:network

friends:
  notify-join: true
  message: "<gold>⚡</gold> <white>Votre ami <yellow>%friend%</yellow> vient de rejoindre le serveur</white>"

notifications:
  first-join-broadcast: false
  broadcast: "<gold>⚡</gold> <yellow>%player%</yellow> <gray>joue avec ValerisClient</gray>"
